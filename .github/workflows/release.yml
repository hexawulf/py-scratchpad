# Release: on a pushed tag vX.Y.Z (or by hand for an existing tag), run CI on
# that tag, then build linux/amd64 + linux/arm64 and push
# 0xwulf/py-scratchpad:X.Y.Z, :X.Y and :latest with SBOM and provenance
# attestations. Only runs in hexawulf/py-scratchpad; Docker Hub credentials are
# used in the publish job alone, after the tests passed.
# Trivy gate (same steps as ContainerYard): before Docker Hub is touched, an
# amd64 copy of the image is built and scanned. A fixable CRITICAL fails the
# release; fixable HIGH and all findings go to the job summary and the
# Security tab (SARIF). Accepted findings go in .trivyignore with a reason and
# an expiry.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.1.1
        required: true
        type: string
      latest:
        description: Also move :latest (untick when republishing an older version)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag
    if: github.repository == 'hexawulf/py-scratchpad'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - name: Validate the tag name
        id: check
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >>"$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.check.outputs.ref }}
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Tag matches package.json version
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          pkg=$(jq -r .version package.json)
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::package.json version is $pkg, tag is $TAG"
            exit 1
          fi

  test:
    name: CI on the tag
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}

  scan:
    name: Build and scan (amd64, arm64)
    needs: [tag, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # Trivy SARIF -> Security tab
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false

      # SOURCE_DATE_EPOCH is the tagged commit's committer date. The image has
      # no .git, so this is the only way the build can date itself from the
      # source rather than from the build clock — which is what makes two
      # builds of one tag produce identical assets. See vite.config.ts.
      - name: Commit of the tag
        id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image version metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: 0xwulf/py-scratchpad
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}

      - name: Prepare Trivy output directory
        run: mkdir -p "$RUNNER_TEMP/trivy/cache"

      # Export both architectures as docker-archive tarballs (Trivy --input reads
      # these; it cannot read a buildx type=oci tarball) so Trivy scans both without
      # mounting /var/run/docker.sock or running in the publish job.
      - name: Build linux/amd64 image archive for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/trivy/amd64.tar
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.rev.outputs.epoch }}
          pull: true
          cache-from: type=gha

      - name: Build linux/arm64 image archive for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/trivy/arm64.tar
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.rev.outputs.epoch }}
          pull: true
          cache-from: type=gha

      # Trivy runs from its official image pinned by digest (not trivy-action),
      # scanning the image archives via --input with no Docker socket mount and $PWD
      # mounted read-only. .trivyignore in the repo root is honoured via -w /src.
      - name: Trivy report (amd64 + arm64)
        id: trivy
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          out="$RUNNER_TEMP/trivy"   # outside the build context
          trivy_scan() {
            docker run --rm \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --user "$(id -u):$(id -g)" \
              -v "$PWD:/src:ro" -w /src \
              -v "$out:/out" \
              "$TRIVY_IMAGE" image --quiet --cache-dir /out/cache --scanners vuln "$@"
          }
          total_crit=0
          {
            echo "### Trivy: $TAG (linux/amd64 + linux/arm64)"
          } >>"$GITHUB_STEP_SUMMARY"

          for arch in amd64 arm64; do
            trivy_scan --input "/out/${arch}.tar" --format sarif --output "/out/trivy-${arch}.sarif"
            trivy_scan --input "/out/${arch}.tar" --severity CRITICAL,HIGH --ignore-unfixed --format json --output "/out/fixable-${arch}.json"
            crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$out/fixable-${arch}.json")
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$out/fixable-${arch}.json")
            total_crit=$((total_crit + crit))
            {
              echo
              echo "#### linux/$arch — Fixable: **$crit CRITICAL**, **$high HIGH**"
              if [ "$((crit + high))" -gt 0 ]; then
                echo
                echo "| Severity | Package | Installed | Fixed in | ID |"
                echo "|---|---|---|---|---|"
                jq -r '.Results[]? | .Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' "$out/fixable-${arch}.json" | sort -u
              fi
            } >>"$GITHUB_STEP_SUMMARY"
          done

          echo "critical=$total_crit" >>"$GITHUB_OUTPUT"

      - name: Upload Trivy amd64 results to the Security tab
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy-amd64.sarif
          category: trivy-image-amd64

      - name: Upload Trivy arm64 results to the Security tab
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy-arm64.sarif
          category: trivy-image-arm64

      - name: Trivy gate (fixable CRITICAL)
        env:
          CRIT: ${{ steps.trivy.outputs.critical }}
        run: |
          if [ "$CRIT" -eq 0 ]; then
            echo "no fixable CRITICAL findings across amd64 and arm64"
          else
            echo "::error::$CRIT fixable CRITICAL findings; release blocked before Docker Hub. Fix them, or add a reasoned, expiring entry to .trivyignore"
            exit 1
          fi

  publish:
    name: Build and push (amd64, arm64)
    needs: [tag, test, scan]
    # Docker Hub secrets belong to this environment (deployments: main + v* tags only).
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false

      - name: Commit of the tag
        id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: 0xwulf/py-scratchpad
          # pre-releases (vX.Y.Z-rc.1) get only their own tag, never :X.Y or :latest
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
          flavor: |
            latest=${{ (github.event_name == 'workflow_dispatch' && !inputs.latest) && 'false' || 'auto' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # context: . builds the checked-out tag (the default git context would
      # use github.ref, which is a branch for workflow_dispatch). The OCI labels
      # come from the Dockerfile, filled by VERSION and REVISION. The web build
      # stage is $BUILDPLATFORM-pinned, so dist/ is built once natively rather
      # than a second time under arm64 emulation.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.rev.outputs.epoch }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
