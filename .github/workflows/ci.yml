# CI: lint, unit tests and the production build. Also called by release.yml
# with the tag to test before publishing.
# No secrets are used here, so pull requests from forks run it safely.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (release.yml passes refs/tags/vX.Y.Z)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node (from package.json engines)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The browser is pinned by @playwright/test's exact version in
      # package.json, so this downloads the same build every run. Only
      # chromium: a second 13 MB WebAssembly download per browser buys little
      # for a smoke test.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Runs against `npm run preview`, i.e. the dist/ built above — including
      # the COOP/COEP headers that make the page cross-origin isolated, which
      # is what the input() and Stop tests depend on.
      - name: Browser smoke test
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
