# py-scratchpad (github.com/hexawulf/py-scratchpad) on piapps2.
# No data: everything the user types lives in their browser's localStorage.
# Update deliberately: change the pinned tag, then `docker compose pull` and
# `docker compose up -d`. The tag is pinned, so watchtower must skip it.
#
# Local test builds use docker-compose.dev.yml alongside this file; see
# docs/DEPLOY.md §3.
#
# The port is bound to the piapps2 LAN address only (192.168.50.120, the eth0
# address — never .179/wlan0). piapps nginx proxies to it; nothing else should
# reach the container.
#
# read_only: the nginx entrypoint tolerates a read-only rootfs (its
# 10-listen-on-ipv6-by-default.sh test-writes default.conf and skips when that
# fails), so only nginx's own writable paths need a tmpfs.

services:
  py-scratchpad:
    image: 0xwulf/py-scratchpad:0.3.2
    container_name: py-scratchpad
    restart: unless-stopped
    ports:
      - "192.168.50.120:5040:80"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      # busybox wget, already in the nginx alpine image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false
