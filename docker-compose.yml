# py-scratchpad (github.com/hexawulf/py-scratchpad), production compose file.
# No data: everything the user types lives in their browser's localStorage.
# Update deliberately: change the pinned tag, then `docker compose pull` and
# `docker compose up -d`. The tag is pinned, so watchtower must skip it.
#
# Local test builds use docker-compose.dev.yml alongside this file; see
# docs/DEPLOY.md §3.
#
# The port is bound to the deploy host's wired LAN address only, read from
# PY_SCRATCHPAD_BIND_ADDR in the gitignored .env beside this file (never the
# Wi-Fi address). The edge nginx proxies to it; nothing else should reach the
# container. Without .env it binds to 127.0.0.1, so it fails closed.
#
# read_only: the nginx entrypoint tolerates a read-only rootfs (its
# 10-listen-on-ipv6-by-default.sh test-writes default.conf and skips when that
# fails), so only nginx's own writable paths need a tmpfs.

services:
  py-scratchpad:
    image: 0xwulf/py-scratchpad:0.3.11
    container_name: py-scratchpad
    restart: unless-stopped
    ports:
      - "${PY_SCRATCHPAD_BIND_ADDR:-127.0.0.1}:5040:80"
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,nodev,size=16m
      - /var/run:noexec,nosuid,nodev,size=1m
      - /tmp:noexec,nosuid,nodev,size=4m
    healthcheck:
      # busybox wget, already in the nginx alpine image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false
