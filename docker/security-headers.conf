# Security headers, shared by every location that sets a header of its own.
#
# nginx's add_header is NOT additive across levels: as soon as a location block
# contains one add_header, nginx stops inheriting the server-level ones, so the
# whole set has to be repeated. Including this file is how that is done here.
# Keep it to add_header only, so it stays valid in any location context.
#
# The CSP is the one from docs/PLAN.md §5. 'wasm-unsafe-eval' is what lets
# Pyodide compile CPython; worker-src 'self' is the Pyodide worker. Note that
# connect-src 'self' is the no-CDN rule in force: the runtime is fetched from
# /pyodide/<version>/ on this origin and nothing else is ever requested.
#
# COOP + COEP make the document CROSS-ORIGIN ISOLATED, which is what gives it
# SharedArrayBuffer — and with it Stop's interrupt buffer (a KeyboardInterrupt
# that keeps the interpreter) and the synchronous input() bridge. Without them
# `self.crossOriginIsolated` is false, Stop can only terminate the worker, and
# input() has to be fed from the Program input box instead.
#
# They are safe here because this page loads nothing cross-origin: require-corp
# would block a third-party image or script, and there are none. The About
# dialog's external links are plain navigations with rel="noopener", which COOP
# does not affect. vite.config.ts sets the same two headers on the dev and
# preview servers, so `npm run dev` behaves like production.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
