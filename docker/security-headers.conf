# Security headers, shared by every location that sets a header of its own.
#
# nginx's add_header is NOT additive across levels: as soon as a location block
# contains one add_header, nginx stops inheriting the server-level ones, so the
# whole set has to be repeated. Including this file is how that is done here.
# Keep it to add_header only, so it stays valid in any location context.
#
# The CSP is the one from docs/PLAN.md §5. 'wasm-unsafe-eval' and
# worker-src blob: are already here for the v0.3 Pyodide worker.
# COOP/COEP are deliberately NOT set yet — they arrive with the v0.3 input()
# bridge, which needs cross-origin isolation.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
