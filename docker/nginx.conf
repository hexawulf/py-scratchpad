# Container nginx for py-scratchpad. Installed as /etc/nginx/conf.d/default.conf,
# so it replaces the image's stock server block.
#
# Static files only: no backend, no proxying, no SPA fallback. A request for a
# path that does not exist must 404, not silently return index.html.
#
# Every location that adds a header includes /etc/nginx/snippets/security-headers.conf,
# because a location-level add_header discards all server-level ones.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        text/css
        image/svg+xml
        application/json
        application/wasm;

    # Errors must not inherit the surrounding location's Cache-Control; a 404
    # under /assets/ would otherwise be cached as immutable for a year.
    error_page 403 404 = @notfound;

    location @notfound {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 404 "404 Not Found\n";
    }

    # Vite writes content-hashed filenames into /assets/, so a given URL never
    # changes content and can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The Pyodide runtime, staged by build/pyodide.ts into
    # /pyodide/<version>/. The version is in the path, so a given URL never
    # changes content — the same contract /assets/ has, and the same year-long
    # immutable cache. A bump changes the path, so nothing has to be purged.
    #
    # Two of the five files need their Content-Type asserted rather than looked
    # up, because getting either wrong stops the runtime from starting at all:
    #
    #   .wasm  served as application/octet-stream makes
    #          WebAssembly.instantiateStreaming refuse the module outright.
    #   .mjs   is NOT in nginx's mime.types, so it falls through to
    #          default_type and arrives as application/octet-stream — and a
    #          browser refuses to execute a module script that is not sent with
    #          a JavaScript MIME type. The worker reaches pyodide.mjs through a
    #          dynamic import(), so the whole Run button fails with "Failed to
    #          fetch dynamically imported module". This shipped broken in 0.3.0;
    #          `npm run test:e2e:image` is the check that now catches it, because
    #          vite preview types .mjs correctly and nginx does not.
    #
    # `types { }` — EMPTY — disables extension lookup for the one location so
    # `default_type` applies. A non-empty `types` block would instead REPLACE
    # the whole inherited table, un-typing every .css and .js in the image.
    location ~ ^/pyodide/.+\.wasm$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    location ~ ^/pyodide/.+\.mjs$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    # The rest: pyodide-lock.json and python_stdlib.zip are typed by
    # mime.types, and LICENSE has no extension — text/plain so a browser shows
    # it rather than downloading it.
    location /pyodide/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type text/plain;
        try_files $uri =404;
    }

    # The entry document must never be cached: it is what points at the current
    # hashed asset names.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else is an unhashed file copied verbatim from public/
    # (favicon.svg today). Short cache, so a replacement is picked up the same day.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
