# Container nginx for py-scratchpad. Installed as /etc/nginx/conf.d/default.conf,
# so it replaces the image's stock server block.
#
# Static files only: no backend, no proxying, no SPA fallback. A request for a
# path that does not exist must 404, not silently return index.html.
#
# Every location that adds a header includes /etc/nginx/snippets/security-headers.conf,
# because a location-level add_header discards all server-level ones.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        text/css
        image/svg+xml;

    # Errors must not inherit the surrounding location's Cache-Control; a 404
    # under /assets/ would otherwise be cached as immutable for a year.
    error_page 403 404 = @notfound;

    location @notfound {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 404 "404 Not Found\n";
    }

    # Vite writes content-hashed filenames into /assets/, so a given URL never
    # changes content and can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document must never be cached: it is what points at the current
    # hashed asset names.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else is an unhashed file copied verbatim from public/
    # (favicon.svg today). Short cache, so a replacement is picked up the same day.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
